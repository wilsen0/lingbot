name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a new commit lands on the same ref —
# the latest commit is what matters and we don't want CI hours
# burning on stale code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lock down GITHUB_TOKEN to read-only by default. Individual jobs that
# need write scopes (currently none) can opt in.
permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Keep uv's cache predictable for the cache action below.
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
  # Avoid pnpm's "Ignored build scripts" warning blocking CI on
  # transitive native deps that we don't actually need to build.
  PNPM_CONFIG_AUTO_INSTALL_PEERS: "true"

jobs:
  # ---------------------------------------------------------------------
  # Python: lint, typecheck, tests across our supported interpreters.
  # ---------------------------------------------------------------------
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Sync workspace
        run: uv sync --all-packages --python ${{ matrix.python }}

      - name: ruff (lint)
        run: uv run ruff check packages
        # Run on every interpreter so a 3.13-only `match` syntax bug or
        # 3.11-only string method doesn't sneak in.

      - name: ruff (format check)
        run: uv run ruff format --check packages

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest
        run: uv run pytest -q --maxfail=5
        # ``--maxfail`` keeps PR feedback fast; the contributor sees
        # the first cluster of failures rather than the full 500.

  # ---------------------------------------------------------------------
  # Frontend: TS typecheck, ESLint, drift check against committed
  # OpenAPI snapshot.
  # ---------------------------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/webui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck
        # Catches imports of OpenAPI types that drift from the snapshot.

  # ---------------------------------------------------------------------
  # OpenAPI drift: bring up the Python backend in-process, hit
  # /api/openapi.json, and compare against the committed snapshot.
  # The python suite already has a unit-level drift test, but this job
  # adds the same check from the frontend's perspective so a broken
  # JS check-api.mjs surfaces in CI too.
  # ---------------------------------------------------------------------
  openapi-drift:
    name: openapi drift
    runs-on: ubuntu-latest
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - run: uv python install 3.13
      - run: uv sync --all-packages --python 3.13

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Start backend in background
        # Use the WebUI-only mode (no agent / no real adapters) so we
        # don't depend on env-vars or rule files. We bind explicitly to
        # 127.0.0.1 — the workflow's localhost — and pass a fresh
        # JWT secret so the auth store is happy.
        run: |
          uv run linling run bot/bot.yaml --webui --webui-port 8787 \
            > /tmp/linling.log 2>&1 &
          echo $! > /tmp/linling.pid
          # Wait up to 30s for /api/health to come up.
          for i in $(seq 1 60); do
            if curl -sf --max-time 1 http://127.0.0.1:8787/api/health > /dev/null; then
              echo "backend up after ${i}/60 attempts"
              exit 0
            fi
            sleep 0.5
          done
          echo "backend did not come up"
          tail -50 /tmp/linling.log
          exit 1

      - name: Drift check
        run: pnpm run api:check
        working-directory: packages/webui/frontend

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/linling.pid ]; then
            kill "$(cat /tmp/linling.pid)" 2>/dev/null || true
          fi

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linling-backend-log
          path: /tmp/linling.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Pre-commit: catches anything the targeted jobs above missed
  # (whitespace, large files, etc).
  # ---------------------------------------------------------------------
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            **/pyproject.toml

      - run: uv python install 3.13
      - run: uv sync --python 3.13

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: uv run pre-commit run --all-files --show-diff-on-failure
