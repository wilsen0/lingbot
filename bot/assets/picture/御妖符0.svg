    <!-- 妖 rune (center) -->
    <rect x="42" y="42" width="2" height="20" fill="#888"/>
    <rect x="48" y="40" width="2" height="22" fill="#888"/>
    <rect x="54" y="42" width="2" height="20" fill="#888"/>
    <rect x="42" y="46" width="14" height="2" fill="#888"/>
