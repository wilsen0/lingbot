    </radialGradient>

  
    <linearGradient id="yfbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff5d8"/>
      <stop offset="100%" stop-color="#ffd6a8"/>
    </linearGradient>

  </defs>
<rect width="120" height="120" fill="url(#yfbg)"/>

  <g>
    <rect x="24" y="28" width="48" height="64" fill="#d8d8d8"/>
    <rect x="24" y="28" width="48" height="3" fill="#a8a8a8"/>
    <rect x="24" y="89" width="48" height="3" fill="#a8a8a8"/>
    <rect x="24" y="28" width="3" height="64" fill="#a8a8a8"/>
