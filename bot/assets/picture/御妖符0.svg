  <circle cx="92" cy="28" r="14" fill="#888"/>
  <circle cx="92" cy="28" r="14" fill="none" stroke="#555" stroke-width="2"/>
  <rect x="86" y="22" width="12" height="2" fill="#fff" transform="rotate(45 92 28)"/>
