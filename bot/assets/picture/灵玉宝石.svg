<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"
     shape-rendering="crispEdges" image-rendering="pixelated"
     role="img" aria-label="灵玉宝石">
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff8aa6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff8aa6" stop-opacity="0"/>
    </radialGradient>

  
  </defs>

  <!-- soft halo -->
  <ellipse cx="40" cy="40" rx="34" ry="34" fill="#ffd0f0" opacity=".35"/>
  <g transform="translate(28 26)">
    <rect x="10" y="0" width="4" height="2" fill="#7a1d6a"/>
  <rect x="8" y="2" width="8" height="2" fill="#a83b9a"/>
  <rect x="6" y="4" width="12" height="2" fill="#a83b9a"/>
  <rect x="4" y="6" width="16" height="2" fill="#a83b9a"/>
  <rect x="2" y="8" width="20" height="2" fill="#a83b9a"/>
  <rect x="0" y="10" width="24" height="2" fill="#a83b9a"/>
  <rect x="2" y="12" width="20" height="6" fill="#d672c4"/>
  <rect x="4" y="18" width="16" height="2" fill="#a83b9a"/>
  <rect x="6" y="20" width="12" height="2" fill="#a83b9a"/>
  <rect x="8" y="22" width="8" height="2" fill="#a83b9a"/>
  <rect x="10" y="24" width="4" height="2" fill="#7a1d6a"/>
  <rect x="8" y="4" width="2" height="4" fill="#fff8ff"/>
  <rect x="10" y="4" width="4" height="2" fill="#ffd0f0"/>
  <rect x="10" y="8" width="2" height="6" fill="#ffd0f0"/>
  </g>
  <!-- twinkle -->
  <g fill="#fff">
    <rect x="20" y="22" width="2" height="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="58" y="46" width="2" height="2">
      <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
