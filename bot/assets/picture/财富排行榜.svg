<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80"
     shape-rendering="crispEdges" image-rendering="pixelated"
     role="img" aria-label="财富排行榜">
  <defs>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff8aa6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff8aa6" stop-opacity="0"/>
    </radialGradient>

  
  </defs>

  <!-- backdrop -->
  <rect width="320" height="80" fill="#fff7e8"/>
  <rect width="320" height="80" fill="none" stroke="#a05a32" stroke-width="2"/>
  <!-- decorative side bars -->
  <rect x="0" y="0" width="6" height="80" fill="#a05a32"/>
  <rect x="314" y="0" width="6" height="80" fill="#a05a32"/>
  <rect x="6" y="0" width="2" height="80" fill="#7a4a25"/>
  <rect x="312" y="0" width="2" height="80" fill="#7a4a25"/>
  <!-- decorative top/bottom rules with dots -->
  <rect x="12" y="6" width="296" height="1" fill="#ff8aa6"/>
  <rect x="12" y="73" width="296" height="1" fill="#ff8aa6"/>
  
  <g transform="translate(20 18)">
    <rect x="20" y="0" width="8" height="4" fill="#7a1d6a"/>
  <rect x="16" y="4" width="16" height="4" fill="#a83b9a"/>
  <rect x="12" y="8" width="24" height="4" fill="#a83b9a"/>
  <rect x="8" y="12" width="32" height="4" fill="#a83b9a"/>
  <rect x="4" y="16" width="40" height="4" fill="#a83b9a"/>
  <rect x="0" y="20" width="48" height="4" fill="#a83b9a"/>
  <rect x="4" y="24" width="40" height="12" fill="#d672c4"/>
  <rect x="8" y="36" width="32" height="4" fill="#a83b9a"/>
  <rect x="12" y="40" width="24" height="4" fill="#a83b9a"/>
  <rect x="16" y="44" width="16" height="4" fill="#a83b9a"/>
  <rect x="20" y="48" width="8" height="4" fill="#7a1d6a"/>
  <rect x="16" y="8" width="4" height="8" fill="#fff8ff"/>
  <rect x="20" y="8" width="8" height="4" fill="#ffd0f0"/>
  <rect x="20" y="16" width="4" height="12" fill="#ffd0f0"/>
  </g>

  <!-- title text -->
  <text x="170" y="50" font-family="serif" font-size="34"
        font-weight="bold" text-anchor="middle"
        fill="#a02030" stroke="#ff8aa6" stroke-width="0.5">财富排行榜</text>
  <!-- corner ornaments -->
  <g fill="#ff5577">
    <rect x="12" y="12" width="4" height="2"/>
    <rect x="14" y="10" width="2" height="2"/>
    <rect x="14" y="14" width="2" height="2"/>
    <rect x="304" y="12" width="4" height="2"/>
    <rect x="304" y="10" width="2" height="2"/>
    <rect x="304" y="14" width="2" height="2"/>
    <rect x="12" y="66" width="4" height="2"/>
    <rect x="14" y="64" width="2" height="2"/>
    <rect x="14" y="68" width="2" height="2"/>
    <rect x="304" y="66" width="4" height="2"/>
    <rect x="304" y="64" width="2" height="2"/>
    <rect x="304" y="68" width="2" height="2"/>
  </g>

</svg>
