<?xml version="1.0" encoding="UTF-8"?>
<!--
  狐妖微博更新 banner — replaces s1.ax1x.com bcebos hosted
  banner used by the "狐妖更新微博备用" trigger.

  Susu peeks out from behind a hanging scroll while a tiny envelope-
  /weibo-style speech bubble floats nearby. Soft peach-coral sky.

  Character keys (matched to canon refs): bright golden-yellow hair
  with ahoge, golden ears with white fluff, big emerald eyes with
  highlight, pink hanfu top with white inner V-collar, red waist
  ribbon, golden bell. Pixel-art on a 64-grid; nearest-neighbour
  preserves crisp edges in modern browsers.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"
     shape-rendering="crispEdges" image-rendering="pixelated"
     role="img" aria-label="狐妖小红娘微博更新提示">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffe9d6"/>
      <stop offset="55%" stop-color="#ffd1d6"/>
      <stop offset="100%" stop-color="#ffb6c4"/>
    </linearGradient>
    <linearGradient id="scroll" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff8e8"/>
      <stop offset="100%" stop-color="#ffe8c4"/>
    </linearGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8aa6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff8aa6" stop-opacity="0"/>
    </radialGradient>
    <symbol id="spark" viewBox="0 0 5 5" overflow="visible">
      <g fill="#fff7c4">
        <rect x="2" y="0" width="1" height="5"/>
        <rect x="0" y="2" width="5" height="1"/>
        <rect x="1" y="1" width="3" height="3" fill="#fff"/>
      </g>
    </symbol>
  </defs>

  <!-- Sky / soft backdrop -->
  <rect width="320" height="180" fill="url(#sky)"/>

  <!-- Decorative cloud puff (right) -->
  <g fill="#fff" opacity=".55">
    <rect x="240" y="22" width="40" height="8"/>
    <rect x="232" y="30" width="56" height="8"/>
    <rect x="248" y="14" width="24" height="8"/>
  </g>
  <!-- Decorative cloud puff (left) -->
  <g fill="#fff" opacity=".5">
    <rect x="32" y="40" width="48" height="6"/>
    <rect x="40" y="46" width="32" height="6"/>
  </g>

  <!-- Twinkling sparkles -->
  <use href="#spark" x="60"  y="22" width="10" height="10">
    <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
  </use>
  <use href="#spark" x="270" y="100" width="8"  height="8">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </use>
  <use href="#spark" x="146" y="14" width="8"  height="8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3.0s" begin="0.5s" repeatCount="indefinite"/>
  </use>

  <!-- Hanging scroll (paper banner) -->
  <g>
    <rect x="60" y="56" width="200" height="4" fill="#7a4a25"/>
    <rect x="56" y="48" width="208" height="8" fill="#a05a32"/>
    <rect x="50" y="52" width="6"  height="4" fill="#7a4a25"/>
    <rect x="264" y="52" width="6" height="4" fill="#7a4a25"/>
    <rect x="66" y="60" width="188" height="86" fill="url(#scroll)"/>
    <rect x="70" y="64" width="180" height="78" fill="none" stroke="#d49b66" stroke-width="1"/>
    <rect x="56" y="146" width="208" height="8" fill="#a05a32"/>
    <rect x="60" y="154" width="200" height="4" fill="#7a4a25"/>
    <rect x="50" y="148" width="6"  height="4" fill="#7a4a25"/>
    <rect x="264" y="148" width="6" height="4" fill="#7a4a25"/>
    <rect x="156" y="158" width="2" height="10" fill="#d83a4d"/>
    <rect x="162" y="158" width="2" height="10" fill="#d83a4d"/>
  </g>

  <!-- "微博更新啦" stylised pixel glyphs on the scroll -->
  <g fill="#d83a4d">
    <!-- 微 -->
    <rect x="86" y="78" width="2" height="32"/>
    <rect x="86" y="78" width="14" height="2"/>
    <rect x="86" y="92" width="14" height="2"/>
    <rect x="98" y="78" width="2" height="32"/>
    <rect x="92" y="84" width="2" height="6"/>
    <rect x="86" y="108" width="14" height="2"/>
    <!-- 博 -->
    <rect x="106" y="78" width="2" height="32"/>
    <rect x="106" y="78" width="14" height="2"/>
    <rect x="106" y="92" width="14" height="2"/>
    <rect x="118" y="78" width="2" height="32"/>
    <rect x="106" y="108" width="14" height="2"/>
    <rect x="112" y="84" width="2" height="6"/>
    <!-- heart divider -->
    <g fill="#ff6f8c">
      <rect x="128" y="84" width="2" height="2"/>
      <rect x="132" y="84" width="2" height="2"/>
      <rect x="126" y="86" width="10" height="2"/>
      <rect x="128" y="88" width="6"  height="2"/>
      <rect x="130" y="90" width="2"  height="2"/>
    </g>
    <!-- 更 -->
    <rect x="142" y="78" width="2" height="32"/>
    <rect x="142" y="78" width="14" height="2"/>
    <rect x="142" y="92" width="14" height="2"/>
    <rect x="154" y="78" width="2" height="32"/>
    <rect x="142" y="108" width="14" height="2"/>
    <rect x="148" y="84" width="2" height="6"/>
    <!-- 新 -->
    <rect x="162" y="78" width="2" height="32"/>
    <rect x="162" y="78" width="14" height="2"/>
    <rect x="162" y="92" width="14" height="2"/>
    <rect x="174" y="78" width="2" height="32"/>
    <rect x="168" y="84" width="2" height="6"/>
    <rect x="162" y="108" width="14" height="2"/>
    <!-- 啦 -->
    <rect x="182" y="78" width="2" height="32"/>
    <rect x="182" y="78" width="6" height="2"/>
    <rect x="182" y="92" width="8" height="2"/>
    <rect x="194" y="82" width="6" height="2"/>
    <rect x="194" y="82" width="2" height="22"/>
    <rect x="198" y="82" width="2" height="22"/>
    <rect x="194" y="96" width="6" height="2"/>
    <rect x="194" y="104" width="6" height="2"/>
  </g>

  <!-- ===== Sūsū peeking out from behind the right edge of the scroll ===== -->
  <g>
    <!-- Big white fluffy fox tail curling up behind her shoulder (signature trait) -->
    <g>
      <!-- tail base / golden root -->
      <rect x="252" y="118" width="10" height="6" fill="#ffd84a"/>
      <rect x="252" y="124" width="6" height="4" fill="#ffd84a"/>
      <!-- white poof -->
      <rect x="246" y="98"  width="22" height="4"  fill="#fff8e8"/>
      <rect x="244" y="102" width="26" height="6"  fill="#fff8e8"/>
      <rect x="242" y="108" width="30" height="8"  fill="#fff8e8"/>
      <rect x="246" y="116" width="22" height="6"  fill="#fff8e8"/>
      <rect x="248" y="122" width="14" height="4"  fill="#fff8e8"/>
      <!-- tail soft shadow -->
      <rect x="244" y="108" width="2" height="8"   fill="#e8d8b8"/>
      <rect x="270" y="108" width="2" height="8"   fill="#e8d8b8"/>
      <rect x="248" y="98"  width="2" height="2"   fill="#e8d8b8"/>
      <rect x="266" y="98"  width="2" height="2"   fill="#e8d8b8"/>
      <!-- tiny outline accents -->
      <rect x="248" y="96" width="4" height="2"  fill="#fff8e8"/>
      <rect x="262" y="96" width="4" height="2"  fill="#fff8e8"/>
    </g>

    <!-- Long flowing yellow hair behind shoulder -->
    <g>
      <rect x="200" y="86" width="38" height="56" fill="#ffd84a"/>
      <rect x="198" y="90" width="2"  height="50" fill="#d8a020"/>
      <rect x="238" y="90" width="2"  height="50" fill="#d8a020"/>
      <rect x="200" y="142" width="38" height="2" fill="#d8a020"/>
      <!-- hair strands hanging below -->
      <rect x="204" y="142" width="6" height="6" fill="#ffd84a"/>
      <rect x="220" y="142" width="6" height="8" fill="#ffd84a"/>
      <rect x="232" y="142" width="6" height="6" fill="#ffd84a"/>
    </g>

    <!-- Fox ears (FOLDED — drooping outward + downward, signature of 苏苏) -->
    <g>
      <!-- left ear: attaches at upper-left of head, hangs outward and down -->
      <rect x="200" y="84" width="2"  height="2"  fill="#d8a020"/>
      <rect x="198" y="86" width="6"  height="2"  fill="#d8a020"/>
      <rect x="196" y="88" width="10" height="2"  fill="#ffd84a"/>
      <rect x="194" y="90" width="12" height="2"  fill="#ffd84a"/>
      <rect x="194" y="92" width="10" height="2"  fill="#ffd84a"/>
      <rect x="196" y="94" width="6"  height="2"  fill="#ffd84a"/>
      <rect x="198" y="96" width="2"  height="2"  fill="#d8a020"/>
      <!-- white inner fluff peeking out at the fold's lower edge -->
      <rect x="198" y="92" width="4" height="2" fill="#fff8e8"/>
      <rect x="200" y="94" width="2" height="2" fill="#fff8e8"/>
      <!-- darker outer rim (the fold crease) -->
      <rect x="194" y="90" width="2" height="2" fill="#d8a020"/>
      <rect x="194" y="92" width="2" height="2" fill="#d8a020"/>

      <!-- right ear: mirrored -->
      <rect x="238" y="84" width="2"  height="2"  fill="#d8a020"/>
      <rect x="236" y="86" width="6"  height="2"  fill="#d8a020"/>
      <rect x="234" y="88" width="10" height="2"  fill="#ffd84a"/>
      <rect x="234" y="90" width="12" height="2"  fill="#ffd84a"/>
      <rect x="236" y="92" width="10" height="2"  fill="#ffd84a"/>
      <rect x="238" y="94" width="6"  height="2"  fill="#ffd84a"/>
      <rect x="240" y="96" width="2"  height="2"  fill="#d8a020"/>
      <!-- white inner fluff -->
      <rect x="238" y="92" width="4" height="2" fill="#fff8e8"/>
      <rect x="238" y="94" width="2" height="2" fill="#fff8e8"/>
      <!-- darker outer rim -->
      <rect x="244" y="90" width="2" height="2" fill="#d8a020"/>
      <rect x="244" y="92" width="2" height="2" fill="#d8a020"/>
    </g>

    <!-- (No ahoge — reference frames don't show one prominently) -->

    <!-- Head / face -->
    <g>
      <!-- skin base -->
      <rect x="206" y="84" width="28" height="4"  fill="#fff0d8"/>
      <rect x="204" y="88" width="32" height="22" fill="#fff0d8"/>
      <!-- soft outline -->
      <rect x="204" y="88" width="2"  height="22" fill="#e8c8a8"/>
      <rect x="234" y="88" width="2"  height="22" fill="#e8c8a8"/>
      <rect x="206" y="84" width="28" height="2"  fill="#e8c8a8"/>
      <rect x="204" y="110" width="32" height="2" fill="#e8c8a8"/>

      <!-- Hair fringe (front) -->
      <rect x="204" y="86" width="32" height="6" fill="#ffd84a"/>
      <rect x="206" y="92" width="6"  height="2" fill="#ffd84a"/>
      <rect x="216" y="92" width="4"  height="2" fill="#ffd84a"/>
      <rect x="226" y="92" width="6"  height="2" fill="#ffd84a"/>
      <rect x="206" y="86" width="2" height="6"  fill="#d8a020"/>
      <rect x="234" y="86" width="2" height="6"  fill="#d8a020"/>
      <!-- side bangs -->
      <rect x="200" y="92" width="4" height="14" fill="#ffd84a"/>
      <rect x="236" y="92" width="4" height="14" fill="#ffd84a"/>
      <rect x="200" y="92" width="2" height="14" fill="#d8a020"/>
      <rect x="238" y="92" width="2" height="14" fill="#d8a020"/>

      <!-- Big emerald eyes with highlight -->
      <g>
        <!-- left -->
        <rect x="208" y="96" width="6" height="6" fill="#3aa05c"/>
        <rect x="208" y="96" width="6" height="2" fill="#1f6a3c"/>
        <rect x="210" y="98" width="2" height="2" fill="#fff"/>
        <rect x="212" y="100" width="1" height="1" fill="#fff"/>
        <!-- right -->
        <rect x="226" y="96" width="6" height="6" fill="#3aa05c"/>
        <rect x="226" y="96" width="6" height="2" fill="#1f6a3c"/>
        <rect x="228" y="98" width="2" height="2" fill="#fff"/>
        <rect x="230" y="100" width="1" height="1" fill="#fff"/>
      </g>

      <!-- Cheeks blush -->
      <ellipse cx="208" cy="106" rx="3" ry="2" fill="url(#cheek)"/>
      <ellipse cx="232" cy="106" rx="3" ry="2" fill="url(#cheek)"/>

      <!-- Tiny smile mouth -->
      <rect x="218" y="105" width="2" height="2" fill="#d83a4d"/>
      <rect x="220" y="105" width="2" height="2" fill="#d83a4d"/>

    </g>

    <!-- Pink hanfu top + white V-collar peeking + red ribbon -->
    <g>
      <!-- pink top -->
      <rect x="200" y="112" width="40" height="20" fill="#ff8aa6"/>
      <rect x="200" y="112" width="40" height="2"  fill="#d83a4d"/>
      <rect x="200" y="130" width="40" height="2"  fill="#d83a4d"/>
      <!-- white V-collar -->
      <rect x="216" y="112" width="8"  height="6" fill="#fff"/>
      <rect x="218" y="118" width="4"  height="4" fill="#fff"/>
      <rect x="216" y="112" width="2"  height="6" fill="#e8c8a8"/>
      <rect x="222" y="112" width="2"  height="6" fill="#e8c8a8"/>
      <!-- red waist ribbon (sash) -->
      <rect x="200" y="126" width="40" height="4" fill="#d83a4d"/>
      <!-- ribbon bow -->
      <rect x="216" y="124" width="8" height="8" fill="#ff5577"/>
      <rect x="216" y="124" width="2" height="8" fill="#a02030"/>
      <rect x="222" y="124" width="2" height="8" fill="#a02030"/>
      <rect x="218" y="126" width="4" height="4" fill="#ff8aa6"/>
      <!-- ribbon trailing ends -->
      <rect x="218" y="132" width="2" height="6" fill="#d83a4d"/>
      <rect x="220" y="132" width="2" height="8" fill="#d83a4d"/>
      <!-- golden bell on the collar -->
      <rect x="218" y="116" width="4" height="4" fill="#fcd34d"/>
      <rect x="217" y="120" width="6" height="2" fill="#e0a92c"/>
      <rect x="219" y="118" width="2" height="2" fill="#fff7c4"/>
    </g>
  </g>

  <!-- Floating envelope with heart seal (the "微博更新" vibe) -->
  <g>
    <rect x="38" y="86" width="34" height="22" fill="#fff7e8"/>
    <rect x="38" y="86" width="34" height="2"  fill="#d49b66"/>
    <rect x="38" y="106" width="34" height="2" fill="#d49b66"/>
    <rect x="38" y="86" width="2" height="22" fill="#d49b66"/>
    <rect x="70" y="86" width="2" height="22" fill="#d49b66"/>
    <rect x="40" y="88" width="14" height="2" fill="#d49b66" transform="rotate(20 40 88)"/>
    <rect x="56" y="88" width="14" height="2" fill="#d49b66" transform="rotate(-20 70 88)"/>
    <g fill="#ff5577">
      <rect x="51" y="96"  width="2" height="2"/>
      <rect x="55" y="96"  width="2" height="2"/>
      <rect x="49" y="98"  width="10" height="2"/>
      <rect x="51" y="100" width="6"  height="2"/>
      <rect x="53" y="102" width="2"  height="2"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -2; 0 0; 0 2; 0 0"
                      dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- Speech ribbon under banner -->
  <g>
    <rect x="80" y="160" width="160" height="14" fill="#ff8aa6"/>
    <rect x="80" y="160" width="160" height="2"  fill="#d83a4d"/>
    <rect x="80" y="172" width="160" height="2"  fill="#d83a4d"/>
    <g fill="#fffaf0">
      <rect x="100" y="166" width="2" height="2"/>
      <rect x="106" y="166" width="2" height="2"/>
      <rect x="112" y="166" width="2" height="2"/>
      <rect x="120" y="164" width="2" height="6"/>
      <rect x="126" y="164" width="2" height="6"/>
      <rect x="132" y="164" width="2" height="6"/>
      <rect x="138" y="166" width="2" height="2"/>
      <rect x="144" y="166" width="2" height="2"/>
      <rect x="150" y="166" width="2" height="2"/>
      <rect x="160" y="164" width="6" height="2"/>
      <rect x="160" y="168" width="6" height="2"/>
      <rect x="160" y="164" width="2" height="6"/>
      <rect x="170" y="164" width="2" height="6"/>
      <rect x="176" y="164" width="2" height="6"/>
      <rect x="170" y="164" width="6" height="2"/>
      <rect x="170" y="168" width="6" height="2"/>
    </g>
  </g>
</svg>
