<?xml version="1.0" encoding="UTF-8"?>
<!--
  漂流瓶 — replaces s1.ax1x.com OwezEn.jpg used by the "漂流瓶"
  trigger (drift-bottle game in the QRDic ruleset).

  A pixel-art glass bottle bobbing on stylised waves. The bottle holds
  a tiny rolled letter; bubbles rise around it and a moon hangs in
  the night-into-dawn sky. SMIL drives the bobbing motion, the
  rising bubbles, and a slow wave shimmer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240"
     shape-rendering="crispEdges" image-rendering="pixelated"
     role="img" aria-label="漂流瓶在海面上漂浮">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a2c5c"/>
      <stop offset="55%" stop-color="#3a6db0"/>
      <stop offset="100%" stop-color="#7ec0ee"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3aa6d0"/>
      <stop offset="45%" stop-color="#1f7aa6"/>
      <stop offset="100%" stop-color="#0e3a66"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#cdeaf0" stop-opacity=".88"/>
      <stop offset="100%" stop-color="#7fb3c7" stop-opacity=".94"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="320" height="160" fill="url(#sky)"/>

  <!-- Stars (SMIL twinkle) -->
  <g fill="#fff8c4">
    <rect x="32" y="20" width="2" height="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="76" y="34" width="2" height="2">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="240" y="14" width="2" height="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="296" y="40" width="2" height="2">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="190" y="60" width="2" height="2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="120" y="48" width="2" height="2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Crescent moon -->
  <g>
    <circle cx="262" cy="48" r="20" fill="#fff7c4"/>
    <circle cx="270" cy="44" r="18" fill="#3a6db0"/>
    <!-- moon glow -->
    <circle cx="262" cy="48" r="26" fill="#fff7c4" opacity=".18"/>
  </g>

  <!-- Distant horizon line -->
  <rect y="158" width="320" height="2" fill="#ffd391" opacity=".7"/>

  <!-- Sea base -->
  <rect y="160" width="320" height="80" fill="url(#sea)"/>

  <!-- Sea wave layers (back to front) — subtle horizontal sway -->
  <g>
    <g fill="#a8e0f2" opacity=".6">
      <rect x="0"   y="166" width="40" height="2"/>
      <rect x="60"  y="170" width="56" height="2"/>
      <rect x="140" y="166" width="48" height="2"/>
      <rect x="216" y="172" width="40" height="2"/>
      <rect x="276" y="168" width="44" height="2"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
                      values="-4 0; 4 0; -4 0" dur="6s" repeatCount="indefinite"/>
  </g>
  <g>
    <g fill="#7ec0d8" opacity=".7">
      <rect x="20"  y="180" width="60" height="2"/>
      <rect x="100" y="184" width="48" height="2"/>
      <rect x="180" y="180" width="60" height="2"/>
      <rect x="260" y="186" width="60" height="2"/>
    </g>
    <animateTransform attributeName="transform" type="translate"
                      values="6 0; -6 0; 6 0" dur="5s" repeatCount="indefinite"/>
  </g>
  <g fill="#5fa8c4" opacity=".85">
    <rect x="0"   y="200" width="80" height="2"/>
    <rect x="100" y="204" width="60" height="2"/>
    <rect x="180" y="200" width="80" height="2"/>
    <rect x="280" y="204" width="40" height="2"/>
  </g>

  <!-- Rising bubbles -->
  <g fill="#cdeaf0" opacity=".75">
    <circle cx="80" cy="200" r="2">
      <animate attributeName="cy" from="210" to="160" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="200" r="3">
      <animate attributeName="cy" from="214" to="156" dur="4.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="200" r="1.5">
      <animate attributeName="cy" from="210" to="170" dur="2.6s" begin="1.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="2.6s" begin="1.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="200" r="1.5">
      <animate attributeName="cy" from="208" to="168" dur="3.0s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="3.0s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Bottle (centered ~160x180, bobbing) -->
  <g>
    <!-- Cork -->
    <rect x="142" y="118" width="20" height="6" fill="#a06a3a"/>
    <rect x="142" y="118" width="20" height="2" fill="#7a4a25"/>
    <rect x="160" y="120" width="2"  height="4" fill="#7a4a25"/>

    <!-- Neck -->
    <rect x="146" y="124" width="12" height="14" fill="url(#glass)"/>
    <rect x="146" y="124" width="2"  height="14" fill="#a3d3df"/>
    <rect x="156" y="124" width="2"  height="14" fill="#5d8da0"/>

    <!-- Body (rounded shoulders, drawn pixel-style) -->
    <rect x="138" y="138" width="28" height="2" fill="#a3d3df"/>
    <rect x="134" y="140" width="36" height="2" fill="#a3d3df"/>
    <rect x="132" y="142" width="40" height="2" fill="url(#glass)"/>
    <rect x="130" y="144" width="44" height="38" fill="url(#glass)"/>
    <rect x="132" y="182" width="40" height="2"  fill="url(#glass)"/>
    <rect x="134" y="184" width="36" height="2"  fill="url(#glass)"/>
    <rect x="138" y="186" width="28" height="2"  fill="#5d8da0"/>

    <!-- Body outline (left & right) -->
    <rect x="130" y="144" width="2"  height="38" fill="#a3d3df"/>
    <rect x="172" y="144" width="2"  height="38" fill="#5d8da0"/>
    <rect x="132" y="142" width="2"  height="2"  fill="#a3d3df"/>
    <rect x="170" y="142" width="2"  height="2"  fill="#5d8da0"/>

    <!-- Glass highlight -->
    <rect x="136" y="148" width="2"  height="20" fill="#ffffff" opacity=".7"/>
    <rect x="138" y="148" width="2"  height="2"  fill="#ffffff" opacity=".9"/>

    <!-- Rolled letter inside (parchment) -->
    <g>
      <rect x="142" y="156" width="20" height="14" fill="#fff7d6"/>
      <rect x="142" y="156" width="20" height="2"  fill="#e0c890"/>
      <rect x="142" y="168" width="20" height="2"  fill="#c8a868"/>
      <rect x="142" y="156" width="2"  height="14" fill="#e0c890"/>
      <rect x="160" y="156" width="2"  height="14" fill="#c8a868"/>
      <!-- ribbon -->
      <rect x="150" y="154" width="4" height="18" fill="#d83a4d"/>
      <rect x="148" y="160" width="8" height="4"  fill="#ff6f8c"/>
      <rect x="150" y="158" width="4" height="2"  fill="#a02030"/>
      <!-- tiny ink lines -->
      <rect x="144" y="160" width="4" height="1" fill="#7a4a25"/>
      <rect x="156" y="160" width="4" height="1" fill="#7a4a25"/>
      <rect x="144" y="164" width="4" height="1" fill="#7a4a25"/>
      <rect x="156" y="164" width="4" height="1" fill="#7a4a25"/>
    </g>

    <!-- Tiny heart on the bottle -->
    <g fill="#ff5577">
      <rect x="146" y="174" width="2" height="2"/>
      <rect x="150" y="174" width="2" height="2"/>
      <rect x="144" y="176" width="10" height="2"/>
      <rect x="146" y="178" width="6" height="2"/>
      <rect x="148" y="180" width="2" height="2"/>
    </g>

    <!-- Bobbing motion -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -2 -2; 0 0; 2 -1; 0 0"
                      dur="4.8s" repeatCount="indefinite"/>
  </g>

  <!-- Foreground spray pixels -->
  <g fill="#cdeaf0">
    <rect x="118" y="186" width="2" height="2"/>
    <rect x="184" y="186" width="2" height="2"/>
    <rect x="120" y="188" width="2" height="2"/>
    <rect x="182" y="190" width="2" height="2"/>
  </g>

  <!-- Tiny seagull silhouette in distance -->
  <g fill="#fff" opacity=".7">
    <rect x="40" y="80" width="4" height="2" transform="rotate(-15 42 81)"/>
    <rect x="44" y="80" width="4" height="2" transform="rotate(15 46 81)"/>
    <rect x="180" y="68" width="3" height="1" transform="rotate(-15 181 68)"/>
    <rect x="183" y="68" width="3" height="1" transform="rotate(15 184 68)"/>
  </g>
</svg>
