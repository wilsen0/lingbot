<?xml version="1.0" encoding="UTF-8"?>
<!--
  苏苏打瞌睡 — replaces s1.ax1x.com OunIPK.png used by the patience-
  exhausted branch in 御妖符 chain at L4283 (originally a malformed
  bare-URL line — re-housed as a proper ±img= directive).

  Sister piece to 苏苏休息.svg: instead of curled up sleeping, here
  Sūsū sits cross-legged with eyes half-closed, yawning behind a
  sleeve. A paper lantern glows softly beside her.

  Character keys (matched to canon refs): bright golden-yellow hair
  with ahoge, golden ears with white inner fluff, big emerald eyes
  (half-lidded), pink hanfu top with white V-inner + red waist
  ribbon, big white fluffy fox tail, golden bell on collar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200"
     shape-rendering="crispEdges" image-rendering="pixelated"
     role="img" aria-label="苏苏打瞌睡">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#5d4a8a"/>
      <stop offset="55%" stop-color="#b48ac0"/>
      <stop offset="100%" stop-color="#ffd1b8"/>
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#fff5a0"/>
      <stop offset="60%" stop-color="#ffb84a"/>
      <stop offset="100%" stop-color="#d8722a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffe28a" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ffe28a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff8aa6" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ff8aa6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dusk gradient -->
  <rect width="240" height="200" fill="url(#dusk)"/>

  <!-- Distant fireflies / lights -->
  <g fill="#fff7c4">
    <rect x="20"  y="50" width="2" height="2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="60"  y="36" width="2" height="2">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="34" width="2" height="2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="220" y="52" width="2" height="2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Tatami floor -->
  <g>
    <rect x="0"  y="160" width="240" height="40" fill="#d8b88a"/>
    <rect x="0"  y="160" width="240" height="2"  fill="#a08054"/>
    <rect x="40"  y="162" width="2" height="38" fill="#a08054"/>
    <rect x="120" y="162" width="2" height="38" fill="#a08054"/>
    <rect x="200" y="162" width="2" height="38" fill="#a08054"/>
  </g>

  <!-- Floor cushion -->
  <g>
    <rect x="84" y="148" width="80" height="20" fill="#d83a4d"/>
    <rect x="84" y="148" width="80" height="2"  fill="#a02030"/>
    <rect x="84" y="166" width="80" height="2"  fill="#7a1622"/>
    <rect x="122" y="156" width="4" height="4" fill="#fcd34d"/>
    <rect x="100" y="150" width="2" height="16" fill="#a02030" opacity=".6"/>
    <rect x="146" y="150" width="2" height="16" fill="#a02030" opacity=".6"/>
  </g>

  <!-- Paper lantern (right side) -->
  <g>
    <circle cx="200" cy="90" r="40" fill="url(#glow)"/>
    <rect x="199" y="40" width="2" height="20" fill="#5b3022"/>
    <rect x="190" y="58" width="20" height="4" fill="#5b3022"/>
    <rect x="184" y="62" width="32" height="40" fill="url(#lantern)"/>
    <rect x="184" y="62" width="32" height="2"  fill="#a85020"/>
    <rect x="184" y="100" width="32" height="2" fill="#a85020"/>
    <rect x="184" y="62" width="2"  height="40" fill="#a85020"/>
    <rect x="214" y="62" width="2"  height="40" fill="#a85020"/>
    <rect x="186" y="74" width="28" height="1" fill="#a85020" opacity=".7"/>
    <rect x="186" y="84" width="28" height="1" fill="#a85020" opacity=".7"/>
    <rect x="186" y="94" width="28" height="1" fill="#a85020" opacity=".7"/>
    <!-- character "妖" stylised -->
    <g fill="#7a1622">
      <rect x="194" y="76" width="2" height="14"/>
      <rect x="200" y="74" width="2" height="16"/>
      <rect x="206" y="76" width="2" height="14"/>
      <rect x="194" y="80" width="14" height="2"/>
      <rect x="194" y="86" width="14" height="2"/>
    </g>
    <rect x="190" y="102" width="20" height="4" fill="#5b3022"/>
    <rect x="199" y="106" width="2" height="6"  fill="#a02030"/>
    <rect x="197" y="112" width="6" height="2"  fill="#fcd34d"/>
    <rect x="198" y="114" width="4" height="2"  fill="#a02030"/>

    <animateTransform attributeName="transform" type="rotate"
                      values="-3 200 60; 3 200 60; -3 200 60"
                      dur="4.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.92;1;0.92" dur="3.0s" repeatCount="indefinite"/>
  </g>

  <!-- ===== Sūsū sitting on the cushion ===== -->
  <g>
    <!-- Big white fluffy fox tail draped behind, curling out to her left -->
    <g>
      <!-- white poof — large, behind body -->
      <rect x="50" y="124" width="44" height="8"  fill="#fff8e8"/>
      <rect x="46" y="128" width="52" height="10" fill="#fff8e8"/>
      <rect x="44" y="136" width="56" height="10" fill="#fff8e8"/>
      <rect x="48" y="146" width="48" height="6"  fill="#fff8e8"/>
      <rect x="54" y="120" width="36" height="4"  fill="#fff8e8"/>
      <!-- shadow -->
      <rect x="44" y="128" width="2" height="18" fill="#e8d8b8"/>
      <rect x="98" y="128" width="2" height="18" fill="#e8d8b8"/>
      <rect x="50" y="120" width="2" height="4"  fill="#e8d8b8"/>
      <rect x="88" y="120" width="2" height="4"  fill="#e8d8b8"/>
      <!-- highlight -->
      <rect x="62" y="132" width="8" height="1" fill="#fff" opacity=".7"/>
      <rect x="76" y="140" width="8" height="1" fill="#fff" opacity=".7"/>
      <!-- golden root attaching to body -->
      <rect x="88" y="130" width="14" height="6" fill="#ffd84a"/>
      <rect x="92" y="136" width="10" height="4" fill="#ffd84a"/>
      <rect x="88" y="130" width="2"  height="6" fill="#d8a020"/>
    </g>

    <!-- Skirt / hakama (folded crossed) — white outer with pink hem -->
    <g>
      <rect x="92" y="134" width="56" height="24" fill="#fff"/>
      <rect x="92" y="134" width="56" height="2"  fill="#e0c890"/>
      <rect x="92" y="156" width="56" height="2"  fill="#a08054"/>
      <!-- pink hem accent -->
      <rect x="92" y="152" width="56" height="2"  fill="#ff8aa6"/>
      <rect x="92" y="154" width="56" height="2"  fill="#d83a4d"/>
      <!-- pleats -->
      <rect x="106" y="136" width="2" height="20" fill="#e0c890" opacity=".7"/>
      <rect x="120" y="136" width="2" height="20" fill="#e0c890" opacity=".7"/>
      <rect x="134" y="136" width="2" height="20" fill="#e0c890" opacity=".7"/>
      <!-- bare feet with golden bell anklet -->
      <rect x="100" y="158" width="10" height="6" fill="#fff0d8"/>
      <rect x="130" y="158" width="10" height="6" fill="#fff0d8"/>
      <rect x="100" y="156" width="10" height="2" fill="#fcd34d"/>
      <rect x="130" y="156" width="10" height="2" fill="#fcd34d"/>
    </g>

    <!-- Pink hanfu top with white V-collar + red ribbon -->
    <g>
      <rect x="86"  y="100" width="68" height="36" fill="#ff8aa6"/>
      <rect x="86"  y="100" width="68" height="2"  fill="#d83a4d"/>
      <rect x="86"  y="134" width="68" height="2"  fill="#d83a4d"/>
      <rect x="86"  y="100" width="2"  height="36" fill="#d83a4d"/>
      <rect x="152" y="100" width="2"  height="36" fill="#d83a4d"/>

      <!-- white V-collar peeking from neckline -->
      <rect x="112" y="100" width="16" height="10" fill="#fff"/>
      <rect x="116" y="110" width="8"  height="6"  fill="#fff"/>
      <rect x="112" y="100" width="2"  height="10" fill="#e8c8a8"/>
      <rect x="126" y="100" width="2"  height="10" fill="#e8c8a8"/>

      <!-- red waist sash -->
      <rect x="86"  y="124" width="68" height="6"  fill="#d83a4d"/>
      <!-- sash bow center -->
      <rect x="114" y="122" width="12" height="10" fill="#ff5577"/>
      <rect x="114" y="122" width="2"  height="10" fill="#a02030"/>
      <rect x="124" y="122" width="2"  height="10" fill="#a02030"/>
      <rect x="116" y="124" width="8"  height="6"  fill="#ff8aa6"/>
      <!-- ribbon trailing ends -->
      <rect x="118" y="132" width="2"  height="10" fill="#d83a4d"/>
      <rect x="121" y="132" width="2"  height="12" fill="#d83a4d"/>

      <!-- Arm right (resting on knee) -->
      <rect x="146" y="118" width="14" height="14" fill="#ff8aa6"/>
      <rect x="156" y="124" width="6"  height="6"  fill="#fff0d8"/>
      <!-- white sleeve cuff -->
      <rect x="156" y="118" width="6"  height="2"  fill="#fff"/>

      <!-- Arm left raised to cover mouth (yawning) — long pink sleeve -->
      <rect x="78" y="92" width="14" height="22" fill="#ff8aa6"/>
      <rect x="78" y="92" width="14" height="2"  fill="#d83a4d"/>
      <rect x="78" y="112" width="14" height="2" fill="#d83a4d"/>
      <!-- white sleeve cuff -->
      <rect x="86" y="86" width="8"  height="6"  fill="#fff"/>
      <rect x="86" y="86" width="8"  height="2"  fill="#e8c890"/>
      <!-- hand peeking out -->
      <rect x="88" y="80" width="6"  height="6"  fill="#fff0d8"/>

      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -1; 0 0; 0 1; 0 0"
                        dur="3.6s" repeatCount="indefinite"/>
    </g>

    <!-- ===== Head ===== -->
    <g>
      <!-- back hair -->
      <rect x="92"  y="58" width="44" height="44" fill="#ffd84a"/>
      <rect x="90"  y="62" width="2"  height="40" fill="#d8a020"/>
      <rect x="136" y="62" width="2"  height="40" fill="#d8a020"/>
      <rect x="92"  y="58" width="44" height="2"  fill="#d8a020"/>

      <!-- Long hair flowing down past shoulder -->
      <rect x="86" y="98" width="6" height="20" fill="#ffd84a"/>
      <rect x="84" y="100" width="2" height="18" fill="#d8a020"/>
      <rect x="136" y="98" width="6" height="20" fill="#ffd84a"/>
      <rect x="142" y="100" width="2" height="18" fill="#d8a020"/>

      <!-- Fox ears (FOLDED — drooping outward + downward, signature of 苏苏) -->
      <g>
        <!-- left ear -->
        <rect x="92" y="62" width="2"  height="2" fill="#d8a020"/>
        <rect x="90" y="64" width="6"  height="2" fill="#d8a020"/>
        <rect x="88" y="66" width="10" height="2" fill="#ffd84a"/>
        <rect x="86" y="68" width="12" height="2" fill="#ffd84a"/>
        <rect x="86" y="70" width="10" height="2" fill="#ffd84a"/>
        <rect x="88" y="72" width="6"  height="2" fill="#ffd84a"/>
        <rect x="90" y="74" width="2"  height="2" fill="#d8a020"/>
        <!-- white inner fluff -->
        <rect x="90" y="68" width="4" height="2" fill="#fff8e8"/>
        <rect x="92" y="70" width="2" height="2" fill="#fff8e8"/>
        <!-- darker outer rim -->
        <rect x="86" y="68" width="2" height="2" fill="#d8a020"/>
        <rect x="86" y="70" width="2" height="2" fill="#d8a020"/>

        <!-- right ear: mirrored -->
        <rect x="136" y="62" width="2"  height="2" fill="#d8a020"/>
        <rect x="134" y="64" width="6"  height="2" fill="#d8a020"/>
        <rect x="132" y="66" width="10" height="2" fill="#ffd84a"/>
        <rect x="132" y="68" width="12" height="2" fill="#ffd84a"/>
        <rect x="134" y="70" width="10" height="2" fill="#ffd84a"/>
        <rect x="136" y="72" width="6"  height="2" fill="#ffd84a"/>
        <rect x="138" y="74" width="2"  height="2" fill="#d8a020"/>
        <!-- white inner fluff -->
        <rect x="136" y="68" width="4" height="2" fill="#fff8e8"/>
        <rect x="136" y="70" width="2" height="2" fill="#fff8e8"/>
        <!-- darker outer rim -->
        <rect x="142" y="68" width="2" height="2" fill="#d8a020"/>
        <rect x="142" y="70" width="2" height="2" fill="#d8a020"/>
      </g>

      <!-- (No ahoge) -->

      <!-- Face -->
      <rect x="96"  y="68" width="36" height="30" fill="#fff0d8"/>
      <rect x="94"  y="70" width="2"  height="26" fill="#e8c8a8"/>
      <rect x="132" y="70" width="2"  height="26" fill="#e8c8a8"/>
      <rect x="96"  y="68" width="36" height="2"  fill="#e8c8a8"/>
      <rect x="96"  y="96" width="36" height="2"  fill="#e8c8a8"/>

      <!-- fringe -->
      <rect x="96"  y="68" width="36" height="6"  fill="#ffd84a"/>
      <rect x="98"  y="74" width="6"  height="2"  fill="#ffd84a"/>
      <rect x="110" y="74" width="4"  height="2"  fill="#ffd84a"/>
      <rect x="124" y="74" width="6"  height="2"  fill="#ffd84a"/>
      <!-- side bangs -->
      <rect x="92" y="74" width="4" height="20" fill="#ffd84a"/>
      <rect x="132" y="74" width="4" height="20" fill="#ffd84a"/>
      <rect x="92" y="74" width="2" height="20" fill="#d8a020"/>
      <rect x="134" y="74" width="2" height="20" fill="#d8a020"/>

      <!-- Big emerald eyes — half-lidded (drowsy) -->
      <g>
        <!-- left -->
        <rect x="102" y="82" width="6" height="6" fill="#3aa05c"/>
        <rect x="102" y="82" width="6" height="2" fill="#1f6a3c"/>
        <!-- upper lid covering top half -->
        <rect x="102" y="82" width="6" height="3" fill="#5b3022"/>
        <rect x="104" y="86" width="2" height="2" fill="#fff"/>
        <!-- right -->
        <rect x="120" y="82" width="6" height="6" fill="#3aa05c"/>
        <rect x="120" y="82" width="6" height="2" fill="#1f6a3c"/>
        <rect x="120" y="82" width="6" height="3" fill="#5b3022"/>
        <rect x="122" y="86" width="2" height="2" fill="#fff"/>
      </g>

      <!-- Cheeks blush -->
      <ellipse cx="103" cy="92" rx="3" ry="2" fill="url(#cheek)"/>
      <ellipse cx="125" cy="92" rx="3" ry="2" fill="url(#cheek)"/>

      <!-- Yawn mouth (small O) — partly hidden by sleeve overlay above -->
      <rect x="112" y="92" width="6" height="4" fill="#7a1622"/>
      <rect x="113" y="93" width="4" height="2" fill="#ff8aa6"/>

      <!-- White V-collar peeking + red ribbon + bell -->
      <rect x="92"  y="98" width="44" height="6"  fill="#fff"/>
      <rect x="92"  y="104" width="44" height="3" fill="#d83a4d"/>
      <rect x="110" y="100" width="6"  height="6" fill="#fcd34d"/>
      <rect x="109" y="106" width="8"  height="2" fill="#e0a92c"/>
      <rect x="111" y="102" width="2"  height="2" fill="#fff7c4"/>

      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -1; 0 0"
                        dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- (omit yawn wisps — the sleeve + half-lidded eyes already convey drowsiness) -->

  <!-- ZZZ from the corner -->
  <g font-family="monospace" font-size="14" font-weight="bold" fill="#7a8aff">
    <text x="48" y="60">
      Z
      <animate attributeName="opacity" values="0;1;0" dur="3.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;30" dur="3.0s" repeatCount="indefinite"/>
    </text>
    <text x="38" y="50" font-size="10">
      z
      <animate attributeName="opacity" values="0;1;0" dur="3.0s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="50;25" dur="3.0s" begin="1.5s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
