bot_id: linling
name: 涂山苏苏
admin_users:
  - "${BOT_ADMIN_QQ:-10001}"

storage:
  # 数据目录：自动统一管理 ./data 下的 kv.sqlite, audit.sqlite, scheduler.sqlite 及文件
  data_dir: ./data

adapters:
  - kind: cli
  - kind: onebot
    # OneBot v11 服务端地址。若未配置将自动跳过并仅启用终端 CLI 交互
    ws_url: ${ONEBOT_WS_URL}
    access_token: ${ONEBOT_TOKEN}

rules:
  - rules/**/*.ling

agent:
  default_agent: ./agents/susu.yaml
  # 不匹配 DSL 又落不到 LLM 白名单时的兜底回复。留空则静默。
  fallback_reply: ""
  # 私聊（DM/WebUI）一次回复可拆成多条短消息。LLM 输出
  # `{"actions":[{"type":"send","text":"..."},...]}` 时按数组顺序逐条
  # 发出去；纯文字回复仍然走单条路径。dm_max_replies 限制单轮最多几条，
  # dm_max_reply_chars 限制每条字数。把 dm_max_replies 设成 1 等同于关掉。
  dm_max_replies: 3
  dm_max_reply_chars: 500
  # 多条消息从第 2 条开始随机等待，避免连续消息秒发。
  multi_reply_delay_min_s: 2
  multi_reply_delay_max_s: 8
  # LLM 兜底白名单(只影响群聊;私聊 DM 永远开放):
  # - 不写或注释掉 = 群聊全员开放(开箱即聊模式)
  # - [] = 所有群聊都关掉 LLM
  # - ["群号1", "群号2"] = 仅指定群号接入 LLM
  # allowed_scopes:
  #   - "123456789"
  # 群聊 LLM 采用窗口聚合：DSL 仍实时响应，只有兜底聊天会攒一小段时间
  # 后交给 LLM 选择性回复，避免每条群消息都触发一次模型。
  group_batch_enabled: true
  group_batch_window_s: 8
  group_batch_max_messages: 50
  group_batch_max_chars: 6000
  group_batch_max_replies: 3
  group_batch_require_attention: true
  group_batch_max_hold_s: 60
  # 群批时窗到点仍未触发关注规则时,跑一个轻量 LLM (yes/no) 再决定要不要
  # 把这批消息交给主 LLM。关掉就回到老行为(直接丢弃)。配套的 API key /
  # base URL / model 在 .env 里设置(见 .env.example);.env 里没填 key
  # 也没问题——bootstrap 会静默跳过。
  # 已关闭:探针与主模型共用 mimo-v2.5 + max_tokens=10000 非流式,
  # 8 秒超时必现 ReadTimeout,导致批次被 fail-closed 丢弃。恢复前请先配
  # ATTENTION_PROBE_MODEL 等环境变量并收紧探针预算。
  group_batch_attention_probe_enabled: false
  # 苏苏确认注意力窗口(秒): 当苏苏成功回复某人时,该用户在窗口内的
  # 下一条消息会被视为已通过规则关注门(无需再次提到苏苏/带问号等)。
  # 跟 main.ling 的 $写 啊/%群%/苏苏确认$ 共用一个 KV 命名空间,
  # 所以 DSL 和 LLM 路径互相可见。300 秒 = 5 分钟,设为 0 关闭。
  group_batch_attention_window_s: 300
  # 每天第一次群聊 LLM 批处理前，强制走一次现有 summary 压缩流程。
  # 这会同时触发 profile/memory 维护，避免群共享历史无限堆在短期上下文里。
  group_batch_daily_summary_enabled: true
  group_batch_daily_summary_keep_recent_turns: 2
  group_batch_bot_names:
    - 苏苏
    - 涂山苏苏

conversation:
  # 64k 上下文预算；接近上限时自动把旧 turn 折叠成 summary。
  context_max_tokens: 65536
  summary_trigger_tokens: 60000
  summary_keep_recent_turns: 8
  summary_max_tokens: 8000

metrics:
  enabled: true

# linling-webui 段（可选）。未配置则走默认。
webui:
  host: 0.0.0.0
  port: 8787
  jwt_secret: ${LINLING_WEBUI_JWT_SECRET:-change-me-in-prod}
  auth_db_path: ./data/webui_auth.db
  event_buffer_size: 500
  login_rate_per_minute: 5
  write_rate_per_minute: 60
  cors_origins: []
