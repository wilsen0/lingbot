[project]
name = "linling-dsl"
version = "0.0.0"
description = "linling DSL: parser, VM, migrator"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "linling-core",
    "lark>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linling_dsl"]
