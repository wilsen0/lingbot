[project]
name = "linling-adapter-onebot"
version = "0.0.0"
description = "OneBot v11 (QQ) platform adapter"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "linling-core",
    "websockets>=12.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linling_adapter_onebot"]
