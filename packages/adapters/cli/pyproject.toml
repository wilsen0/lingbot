[project]
name = "linling-adapter-cli"
version = "0.0.0"
description = "Local CLI adapter for debugging"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "linling-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linling_adapter_cli"]
