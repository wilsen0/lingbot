[Behavior]
# 共享输入状态：所有窗口共享中英文状态
ShareInputState=No
# 在程序中显示预编辑文本（候选上屏前的拼音）
PreeditEnabledByDefault=True
# 切换输入法时显示输入法信息
ShowInputMethodInformation=True
# 默认页大小（候选词每页个数）
DefaultPageSize=5

[Hotkey]
# 唤出 / 隐藏输入法的快捷键
# 注释掉避免和系统其他快捷键冲突，由 fcitx5 主配置里的 TriggerKeys (Ctrl+Space) 接管
# TriggerKeys=

[TriggerKeys]
# 中文 / 英文切换（按 4 次 Shift_L 在中英文间切）
0=Zenkaku_Hankaku
1=Shift_L+Shift_L

